name = "chorepop-home"
main = "src/index.js"
compatibility_date = "2026-10-23"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "chorepop-db"
database_id = "badbed38-50cd-4759-a56a-0a4691001d3a"

[triggers]
crons = ["0 * * * *"]
