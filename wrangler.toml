name = "chorepop-home"
main = "src/index.js"
compatibility_date = "2026-10-23"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "chorepop-db"
database_id = "00000000-0000-0000-0000-000000000000"

[triggers]
crons = ["0 * * * *"]
